# Local regtest bitcoind. Test RPC credentials only (local network, no real value).
services:
  bitcoind:
    image: bitcoin/bitcoin:29
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=regtest
      - -rpcpassword=regtest
    ports:
      # Boucle locale seulement : le RPC (identifiants de test) n'est pas joignable depuis le réseau local.
      - "127.0.0.1:18443:18443"
